name: CouponHub source checks

on:
  pull_request:
  push:
    branches: [main, Phuc, Quang]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, openssl, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(git ls-files -z '*.php')
      - name: Application JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in assets/vendor/*) continue ;; esac
            node --check "$file"
          done < <(git ls-files -z '*.js')
      - name: Pagination and reusable partial regression checks
        run: php scripts/check_pagination.php
      - name: Keep developer tooling outside the web repository
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files -- '*.py' '*.pyc' '*.sh' '*.ps1' '*.cjs' 'tests/**')"
          if [[ -n "$files" ]]; then
            echo 'Developer tooling belongs in the separate DevTools bundle:'
            echo "$files"
            exit 1
          fi
