name: CouponHub quality checks

on:
  pull_request:
  push:
    branches: [main, Phuc, Quang]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, openssl, curl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PHP syntax (all tracked PHP files)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(git ls-files -z '*.php')
          echo 'PHP lint passed.'

      - name: JavaScript regression tests
        run: node --test tests/*.test.cjs

      - name: PHP regression tests without a database
        shell: bash
        run: |
          set -euo pipefail
          php tests/public-header-notifications-phase6.php
          php tests/coupon-repository-phase7.php
          php tests/coupon-interaction-errors-phase4.php
          php tests/oauth-setup-access-phase5.php
          php tests/session-guards.php
          php tests/router-integration.php
          php tests/oauth-auth.php
          php tests/google-one-tap.php
          php tests/facebook-oauth.php
          php tests/facebook-google-link.php
          php tests/phase4-security.php
          php tests/security-hardening-phase10b.php
          php tests/interaction-rate-limit-phase10c.php
          php tests/interaction-http-response-phase10c.php
          php tests/route-aware-assets-phase9gd2.php
          php tests/provider-integrations.php
          php tests/password-reset-email.php
          php tests/request-token-contract.php
          php tests/campaign-presentation.php
